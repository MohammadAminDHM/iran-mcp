name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test catalog
        run: python -m unittest discover -s tests -v
      - name: Validate tracked JSON files
        run: python scripts/check_json.py
      - name: Validate catalog counts
        run: python scripts/check_counts.py

  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install banner dependencies
        run: python -m pip install fonttools==4.66.1 brotli==1.2.0
      - name: Regenerate catalog and banners
        run: |
          python scripts/catalog.py
          python scripts/banner.py
      - name: Check generated files are committed
        run: |
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard -- plugins .claude-plugin assets)"
          if [ -n "$untracked" ]; then
            printf 'Untracked generated files:\n%s\n' "$untracked"
            exit 1
          fi
